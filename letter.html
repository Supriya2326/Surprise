 
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Birthday Letter</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial;
    background:linear-gradient(135deg,#ff8fb1,#ffc0cb,#ffd6e7);
}

/* Floating Hearts */

.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:1;
}

.hearts span{
    position:absolute;
    bottom:-50px;
    font-size:30px;
    color:white;
    animation:float 8s linear infinite;
}

.hearts span:nth-child(1){ left:10%; animation-duration:6s; }
.hearts span:nth-child(2){ left:30%; animation-duration:8s; }
.hearts span:nth-child(3){ left:50%; animation-duration:7s; }
.hearts span:nth-child(4){ left:70%; animation-duration:10s; }
.hearts span:nth-child(5){ left:90%; animation-duration:6s; }

@keyframes float{

    0%{
        transform:translateY(0);
        opacity:1;
    }

    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}

/* Main Container */

.container{
    text-align:center;
    z-index:2;
    position:relative;
}

/* Envelope */

.envelope{
    position:relative;
    width:400px;
    height:270px;
    background:#ffd6e7;
    border-radius:20px;
    border:5px solid white;
    margin:auto;

    box-shadow:
    0 0 20px rgba(255,255,255,0.8),
    0 0 40px rgba(255,105,180,0.4);
}

/* Decorative Hearts */

.heart{
    position:absolute;
    width:24px;
    height:24px;
    background:#ff4f81;
    transform:rotate(-45deg);
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:24px;
    height:24px;
    background:#ff4f81;
    border-radius:50%;
}

.heart::before{
    top:-12px;
    left:0;
}

.heart::after{
    left:12px;
    top:0;
}

.heart1{
    top:50px;
    left:80px;
}

.heart2{
    top:90px;
    right:90px;
}

.heart3{
    bottom:60px;
    left:180px;
}

/* Envelope Flap */

.flap{
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:200px solid transparent;
    border-right:200px solid transparent;
    border-top:135px solid #ffc0cb;
}

/* FULL CARD DESIGN */

.popup-letter{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%) scale(0);

    width:92%;
    height:92%;

    background:#ffe4ee;

    border-radius:35px;

    padding:60px;

    overflow-y:auto;

    border:10px solid white;

    box-shadow:
    0 0 25px rgba(255,255,255,0.9),
    0 0 50px rgba(255,105,180,0.5);

    transition:0.6s;

    z-index:9999;

    opacity:0;
    visibility:hidden;
}

/* FULL INNER DESIGN */

.popup-letter::before{

    content:"";

    position:absolute;

    top:40px;
    left:40px;
    right:40px;
    bottom:40px;

    border:4px dashed white;

    border-radius:100px;
    
}

/* Show Popup */

.show-popup{

    transform:translate(-50%,-50%) scale(1);

    opacity:1;
    visibility:visible;
}

/* Scrollbar */

.popup-letter::-webkit-scrollbar{
    width:10px;
}

.popup-letter::-webkit-scrollbar-thumb{
    background:#ff69b4;
    border-radius:10px;
}

/* Heading */

.popup-letter h1{
    text-align:center;
    color:black;
    font-size:55px;
    margin-bottom:30px;
    position:relative;
    z-index:2;
}

/* Letter Text */

.popup-letter p{
    font-size:28px;
    line-height:2;
    color:black;
    text-align:center;
    position:relative;
    z-index:2;
}

/* Buttons */

.buttons{
    margin-top:40px;
    text-align:center;
    position:relative;
}

button{
    padding:15px 35px;
    margin:12px;
    border:none;
    border-radius:40px;
    background:white;
    color:#ff1493;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 10px rgba(255,255,255,0.8);
}

button:hover{
    transform:scale(1.1);
    background:#fff0f5;
}

/* Moving Button */

#closeBtn{
    position:relative;
}

/* Text */

.click-text{
    margin-top:25px;
    color:white;
    font-size:28px;
    animation:blink 1s infinite;
}

@keyframes blink{

    50%{
        opacity:0.5;
    }
}

.message{
    color:white;
    font-size:25px;
    margin-top:20px;
    font-weight:bold;
}

/* Back Button */

.popup-back{
    text-align:center;
    margin-top:40px;
    position:relative;
    z-index:2;
}

/* Bottom Buttons */

.bottom-buttons{
    margin-top:30px;
}

.bottom-buttons a{
    text-decoration:none;
}

</style>

</head>

<body>

<!-- Floating Hearts -->

<div class="hearts">

    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>

</div>

<div class="container">

<!-- Envelope -->

<div class="envelope">

    <div class="heart heart1"></div>
    <div class="heart heart2"></div>
    <div class="heart heart3"></div>
    <div class="heart heart4"></div>
    <div class="heart heart5"></div>

    <div class="flap"></div>

</div>

<!-- Popup Card -->

<div class="popup-letter" id="popupLetter">

    <h1>HAPPY BIRTHDAY</h1>

    <p>

        Dear Chinnu..,<br><br>

        EE LETTER LOO EMM LEDHU CLOSE CHESI NEXT CLICK CHEI...

    </p>

    <!-- Back Button -->

    <div class="popup-back">

        <button onclick="closePopup()">
            BACK
        </button>

    </div>

</div>

<!-- Text -->

<div class="click-text" id="clickText">
    Choose A Button
</div>

<!-- Main Buttons -->

<div class="buttons">

    <button onclick="openLetter()">
        OPEN
    </button>

    <button id="closeBtn"
            onmouseover="moveButton()">
        CLOSE
    </button>

</div>

<div class="message" id="message"></div>

<!-- Bottom Buttons -->

<div class="bottom-buttons">

    <a href="photos.html">

        <button>
            Next Surprise
        </button>

    </a>

    <a href="index.html">

        <button>
            Home
        </button>

    </a>

</div>

</div>

<!-- Background Music -->

<audio id="bgMusic" loop>

    <source src="music/birthday.mpeg"
            type="audio/mpeg">

</audio>

<!-- JavaScript -->

<script>

function openLetter(){

    var popup =
        document.getElementById("popupLetter");

    popup.classList.add("show-popup");

    document.getElementById("clickText")
        .innerHTML = "The Letter Is Opened";

    document.getElementById("message")
        .innerHTML = "Don't Close me please... click to open";

    /* Play Music */

    document.getElementById("bgMusic").play();
}

/* Close Popup */

function closePopup(){

    document.getElementById("popupLetter")
        .classList.remove("show-popup");

    document.getElementById("clickText")
        .innerHTML = "Choose A Button";

    document.getElementById("message")
        .innerHTML = "";
}

/* Moving Close Button */

function moveButton(){

    var btn =
        document.getElementById("closeBtn");

    var x = Math.random() * 500 - 250;

    var y = Math.random() * 300 - 150;

    btn.style.transform =
        "translate(" + x + "px," + y + "px)";

    document.getElementById("message")
        .innerHTML = "Don't Close me please... click to open";
}

</script>

</body>
</html>
